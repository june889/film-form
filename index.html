<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쉽고 빠른 인테리어 필름 견적 문의</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --border: #E2DDD6;
      --text: #1A1814;
      --muted: #7A756D;
      --accent: #2D2925;
      --accent-light: #F0EDE8;
      --success: #2E6B4F;
      --success-bg: #EAF4EE;
      --danger: #8B2A2A;
      --danger-bg: #FAEAEA;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* 배경 패턴 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(180,160,130,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(140,120,100,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: var(--accent);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }

    .brand-icon svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #F7F5F0;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.3px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .brand p {
      font-size: 13px;
      color: var(--muted);
      font-weight: 300;
      line-height: 1.6;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 2px 16px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.03);
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .field label .req {
      color: #C0392B;
      margin-left: 2px;
    }

    input[type="tel"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 11px 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    input[type="tel"]:focus,
    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(45,41,37,0.08);
      background: #fff;
    }

    textarea {
      height: 90px;
      resize: vertical;
      line-height: 1.6;
    }

    /* 업로드 영역 */
    .upload-zone {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      background: var(--bg);
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 10px;
      background: var(--accent-light);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .upload-zone .main-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 3px;
    }

    .upload-zone .sub-text {
      font-size: 12px;
      color: var(--muted);
    }

    /* 미리보기 */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-item .del-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      background: rgba(26,24,20,0.65);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .preview-item .del-btn:hover { background: rgba(26,24,20,0.9); }

    .preview-item .del-btn svg {
      width: 11px;
      height: 11px;
      stroke: #fff;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .file-count {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      text-align: right;
    }

    /* 제출 버튼 */
    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 0.5rem;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover:not(:disabled) { opacity: 0.88; }
    .submit-btn:active:not(:disabled) { transform: scale(0.99); }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .submit-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 상태 메시지 */
    .status {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      line-height: 1.5;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .status.success {
      display: block;
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(46,107,79,0.2);
    }

    .status.error {
      display: block;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(139,42,42,0.2);
    }

    /* 설정 안내 */
    .setup-notice {
      margin-top: 1rem;
      padding: 14px 16px;
      background: #FFF8E8;
      border: 1px solid #E8D89A;
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: #7A6A30;
      line-height: 1.7;
    }

    .setup-notice strong { color: #5A4D1F; }
    .setup-notice code {
      background: rgba(0,0,0,0.07);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.25rem 0;
    }

    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 11px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .card { padding: 1.5rem; }
      .preview-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    </div>
    <h1>쉽고 빠른 인테리어 필름 견적 문의</h1>
    <p>현장 사진을 보내주시면<br>문자로 빠르게 견적을 안내해드리겠습니다</p>
  </div>

  <div class="card">
    <div class="field">
      <label>연락처 <span class="req">*</span></label>
      <input type="tel" id="phone" placeholder="010-0000-0000" />
    </div>

    <div class="field">
      <label>지역 / 아파트 <span class="req">*</span></label>
      <input type="text" id="region" placeholder="예) 경기도 의정부시 민락동 e편한세상" />
    </div>

    <div class="field">
      <label>전달 내용 <span class="req">*</span></label>
      <textarea id="memo" placeholder="시공 부위, 면적 등 자세히 적어주세요"></textarea>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>사진 업로드 <span class="req">*</span></label>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*" multiple />
        <div class="upload-icon">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <p class="main-text">클릭하거나 사진을 끌어다 놓으세요</p>
        <p class="sub-text">JPG, PNG, HEIC 지원 · 최대 10장</p>
      </div>
      <div class="preview-grid" id="previewGrid"></div>
      <p class="file-count" id="fileCount"></p>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      접수하기
    </button>

    <div class="status" id="statusMsg"></div>
  </div>



  <p class="footer">접수된 정보는 견적 안내 목적으로만 사용됩니다</p>
  <p class="footer" style="margin-top:6px">수집한 개인정보(연락처)는 견적 안내 목적으로만 사용되며 제3자에게 제공하지 않습니다.</p>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxX8xtz3Ib0_rNJ0JiGJWfDWsf_lUVCcQavxeWEtS9-OTxnK4H7togkaZoxvZ1F9ms9/exec';

  const files = [];

  document.getElementById('fileInput').addEventListener('change', function(e) {
    addFiles(Array.from(e.target.files));
  });

  const zone = document.getElementById('uploadZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    addFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
  });

  function addFiles(newFiles) {
    newFiles.forEach(f => { if (files.length < 10) files.push(f); });
    renderPreviews();
  }

  function renderPreviews() {
    const grid = document.getElementById('previewGrid');
    const count = document.getElementById('fileCount');
    grid.innerHTML = '';
    files.forEach((f, i) => {
      const url = URL.createObjectURL(f);
      const item = document.createElement('div');
      item.className = 'preview-item';
      item.innerHTML = `
        <img src="${url}" alt="미리보기 ${i+1}" />
        <button class="del-btn" onclick="removeFile(${i})" title="삭제">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>`;
      grid.appendChild(item);
    });
    count.textContent = files.length > 0 ? `${files.length} / 10장` : '';
  }

  function removeFile(i) {
    files.splice(i, 1);
    renderPreviews();
  }

  // 사진 압축 후 base64 변환
  function compressAndEncode(file) {
    return new Promise((res, rej) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const MAX = 1024;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else       { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = rej;
      img.src = url;
    });
  }

  async function handleSubmit() {
    const phone  = document.getElementById('phone').value.trim();
    const region = document.getElementById('region').value.trim();
    const memo   = document.getElementById('memo').value.trim();
    const btn    = document.getElementById('submitBtn');

    if (!phone)  { showStatus('error', '연락처를 입력해주세요.'); return; }
    if (!region) { showStatus('error', '지역 / 아파트를 입력해주세요.'); return; }
    if (!memo)   { showStatus('error', '전달 내용을 입력해주세요.'); return; }
    if (files.length === 0) { showStatus('error', '사진을 최소 1장 업로드해주세요.'); return; }

    btn.disabled = true;
    btn.innerHTML = `<svg viewBox="0 0 24 24" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg> 전송 중...`;
    showStatus('', '');

    try {
      // 병렬 압축 전송
      const images = await Promise.all(files.map(f => compressAndEncode(f)));

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ phone, region, memo, images }),
      });

      const result = await res.json();

      if (result.result === 'success') {
        showStatus('success', '✓ 접수가 완료되었습니다! 사진을 확인 후 연락드리겠습니다.');
        btn.innerHTML = '✓ 접수 완료';
      } else {
        throw new Error(result.message);
      }

    } catch (err) {
      console.error(err);
      showStatus('error', '전송에 실패했습니다. 잠시 후 다시 시도해주세요.');
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> 다시 시도`;
    }
  }

  function showStatus(type, msg) {
    const el = document.getElementById('statusMsg');
    el.className = type ? 'status ' + type : 'status';
    el.textContent = msg;
  }
</script>

<style>
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>

</body>
</html>
